services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootlocal}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-facturacion_local}
      MYSQL_USER: ${MYSQL_USER:-factura}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-factura_local}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - caja_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: ./docker/web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./public_html/facturacionv8:/var/www/html/facturacionv8:rw
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-factura}
      DB_PASS: ${MYSQL_PASSWORD:-factura_local}
      DB_NAME: ${MYSQL_DATABASE:-facturacion_local}
      APP_BASE_URI: /facturacionv8/
    depends_on:
      db:
        condition: service_healthy

volumes:
  caja_mysql_data:
